name: Absturz-Waechter
# Alle 5 Min angestossen von cron-job.org (workflow_dispatch). GitHub-Zeitplan nur als Ersatz.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "normal | test (nur Anmeldung pruefen + Testmeldung, nie starten)"
        required: false
        default: "normal"
  schedule:
    - cron: "7,37 * * * *"
concurrency:
  group: waechter
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zustand holen
        run: |
          git fetch -q origin zustand 2>/dev/null && git show FETCH_HEAD:zustand.json > zustand.json 2>/dev/null || echo "{}" > zustand.json
      - name: Pruefen
        env:
          NEXUS_EMAIL: ${{ secrets.NEXUS_EMAIL }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          DISCORD_ALARM: ${{ secrets.DISCORD_ALARM }}
          DISCORD_ERWAEHNEN: ${{ secrets.DISCORD_ERWAEHNEN }}
          PAUSE: ${{ vars.PAUSE }}
          MODUS: ${{ github.event.inputs.modus || 'normal' }}
        run: python3 waechter.py
      - name: Wetter fuer den Launcher (Zweig "wetter")
        # 26.10.2026 (Manu 16:16): alle 5 Min statt nur alle 30 Min im Takt. Stoert den Waechter nie.
        if: always()
        continue-on-error: true
        env:
          NEXUS_EMAIL: ${{ secrets.NEXUS_EMAIL }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 wetter.py
          ls wetter_*.txt >/dev/null 2>&1 || exit 0
          rm -rf /tmp/wetter && mkdir -p /tmp/wetter && cp wetter_*.txt /tmp/wetter/
          cd /tmp/wetter
          git init -q -b wetter
          git config user.name "Sektor7-Wetter"; git config user.email "wetter@users.noreply.github.com"
          printf "Wetter der Sektor7-Server fuer den S7-Launcher (wird alle 5 Min ueberschrieben).\n" > README.md
          git add . && git commit -qm "Wetter $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" wetter:wetter
          echo "Wetter veroeffentlicht."
      - name: Zustand speichern
        if: always()
        run: |
          cp zustand.json /tmp/z.json
          git config user.name "Waechter"; git config user.email "waechter@users.noreply.github.com"
          git checkout -q --orphan zustand-neu
          git rm -rfq . >/dev/null
          cp /tmp/z.json zustand.json
          git add zustand.json
          git commit -qm "Zustand $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          # 26.10.2026 (Manu 23:42): bei GitHub-Aussetzern ("remote rejected") bis zu 3 Versuche statt Fehlermail
          for i in 1 2 3; do
            git push -qf origin zustand-neu:zustand && exit 0
            echo "Speichern fehlgeschlagen (Versuch $i), neuer Versuch in 10 s ..."
            sleep 10
          done
          exit 1
